databases:
  - name: wishly-db
    plan: free
    databaseName: wishly
    user: wishly

services:
  - type: web
    name: wishly-backend
    runtime: python
    rootDir: wish-app/backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"   # set this to your deployed Vercel URL after the frontend is deployed
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: wishly-db
          property: connectionString
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
